name: Release

# Publishes to PyPI with Trusted Publishing: PyPI trusts this workflow's GitHub identity,
# so no API token is stored anywhere. Runs only when a GitHub release is published.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/outfence/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Require the tag to match the package version
        shell: bash
        run: |
          version=$(python -c "import outfence; print(outfence.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$version." >&2
            exit 1
          fi
      - run: python -m build --no-isolation
      - name: Install the wheel and test outside the checkout
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python scripts/smoke_install.py
      - uses: pypa/gh-action-pypi-publish@release/v1
